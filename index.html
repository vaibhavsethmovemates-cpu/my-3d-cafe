<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My 3D Cafe</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm';


// CREATE SCENE

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111111);


// CREATE CAMERA

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 3, 7);


// CREATE SCREEN

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


// LIGHT

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(5, 10, 5);

scene.add(light);


// FLOOR

const floorGeometry =
    new THREE.PlaneGeometry(20, 20);

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x553322
    });

const floor =
    new THREE.Mesh(
        floorGeometry,
        floorMaterial
    );

floor.rotation.x = -Math.PI / 2;

scene.add(floor);


// TABLE

const tableGeometry =
    new THREE.BoxGeometry(2.5, 0.25, 2.5);

const tableMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x8B4513
    });

const table =
    new THREE.Mesh(
        tableGeometry,
        tableMaterial
    );

table.position.y = 1;

scene.add(table);


// TABLE LEGS

for (let x of [-1, 1]) {

    for (let z of [-1, 1]) {

        const legGeometry =
            new THREE.BoxGeometry(
                0.2,
                1,
                0.2
            );

        const leg =
            new THREE.Mesh(
                legGeometry,
                tableMaterial
            );

        leg.position.set(
            x,
            0.5,
            z
        );

        scene.add(leg);
    }
}


// COFFEE CUP

const cupGeometry =
    new THREE.CylinderGeometry(
        0.5,
        0.4,
        0.8,
        32
    );

const cupMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xffffff
    });

const cup =
    new THREE.Mesh(
        cupGeometry,
        cupMaterial
    );

cup.position.set(
    0,
    1.55,
    0
);

scene.add(cup);


// COFFEE

const coffeeGeometry =
    new THREE.CylinderGeometry(
        0.4,
        0.4,
        0.05,
        32
    );

const coffeeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3b1f0f
    });

const coffee =
    new THREE.Mesh(
        coffeeGeometry,
        coffeeMaterial
    );

coffee.position.set(
    0,
    1.97,
    0
);

scene.add(coffee);


// ANIMATION

function animate() {

    requestAnimationFrame(animate);

    cup.rotation.y += 0.01;

    coffee.rotation.y += 0.01;

    renderer.render(
        scene,
        camera
    );
}

animate();


// RESPONSIVE SCREEN

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
